<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Toca no Animal Certo!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Comic Sans MS', 'Trebuchet MS', Verdana, sans-serif;
    background: linear-gradient(160deg, #bdeaff 0%, #d9f7c4 60%, #fff3c4 100%);
  }
  #stage { position: absolute; inset: 0; }

  #scoreBar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 32px; font-weight: bold; color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    z-index: 15;
  }
  #hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #ffffffdd; font-size: 17px; text-align: center; z-index: 15;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    max-width: 90%;
  }

  .critter {
    position: absolute;
    cursor: pointer;
    animation: floatIn 0.35s ease-out, wiggle 2.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
  }
  .critter.wobble { animation: floatIn 0.35s ease-out, wobbleBig 1.6s ease-in-out infinite; }
  @keyframes floatIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wiggle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes wobbleBig { 0%,100% { transform: rotate(-14deg) translateX(-4px); } 50% { transform: rotate(14deg) translateX(4px); } }

  .critter.pop { animation: popOut 0.35s ease-out forwards !important; pointer-events: none; }
  @keyframes popOut { 0% { transform: scale(1); opacity:1; } 60% { transform: scale(1.5); } 100% { transform: scale(2.1); opacity: 0; } }

  .critter.vanish { animation: vanishOut 0.3s ease-in forwards !important; pointer-events: none; }
  @keyframes vanishOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.3); opacity: 0; } }

  .part { position: absolute; }

  /* ---- shared limb ---- */
  .leg { position:absolute; bottom:-4%; width:10%; height:20%; border-radius:6px; }

  /* ---- HORSE ---- */
  .horse-body { left:14%; top:38%; width:72%; height:44%; background:#a5673f; border-radius:46% 46% 40% 40%; }
  .horse-head { left:52%; top:6%; width:40%; height:38%; background:#a5673f; border-radius:48% 48% 40% 40%; }
  .horse-snout { left:70%; top:22%; width:26%; height:20%; background:#8a5230; border-radius:40%; }
  .horse-mane { left:46%; top:2%; width:16%; height:34%; background:#5c3a22; border-radius:40% 10% 40% 10%; }
  .horse-ear { width:10%; height:14%; background:#a5673f; border-radius:50% 50% 20% 20%; top:2%; }
  .horse-ear.l { left:54%; } .horse-ear.r { left:76%; }
  .horse-glasses-bridge { left:66%; top:32%; width:16%; height:5%; background:#151515; border-radius:4px; }
  .horse-glass { width:20%; height:20%; background:#dff3ff; border:5px solid #151515; border-radius:5px; top:24%; }
  .horse-glass.l { left:56%; } .horse-glass.r { left:78%; }
  .horse-tail { left:4%; top:44%; width:12%; height:26%; background:#5c3a22; border-radius:0 60% 60% 0; }

  /* ---- SHEEP ---- */
  .sheep-fluff { background:#faf7ef; border-radius:50%; }
  .sheep-face { left:36%; top:34%; width:30%; height:30%; background:#4a4440; border-radius:50%; }
  .sheep-ear { width:12%; height:12%; background:#e7cdb0; border-radius:50%; top:44%; }
  .sheep-ear.l { left:22%; } .sheep-ear.r { left:66%; }
  .sheep-eye { width:6%; height:6%; background:#fff; border-radius:50%; top:44%; }
  .sheep-eye.l { left:40%; } .sheep-eye.r { left:54%; }
  .sheep-hat { left:34%; top:6%; width:32%; height:16%; border-radius:50% 50% 10% 10%; }
  .sheep-hat-brim { left:28%; top:19%; width:44%; height:6%; border-radius:8px; }

  /* ---- GIRAFFE ---- */
  .giraffe-body { left:24%; top:56%; width:52%; height:30%; background:#f0c14c; border-radius:40%; }
  .giraffe-neck { left:38%; top:8%; width:22%; height:52%; background:#f0c14c; border-radius:30%; }
  .giraffe-head { left:32%; top:2%; width:34%; height:22%; background:#f0c14c; border-radius:44%; }
  .giraffe-horn { width:6%; height:12%; background:#e0a83c; border-radius:4px; top:-6%; }
  .giraffe-horn.l { left:38%; } .giraffe-horn.r { left:56%; }
  .giraffe-hornball { width:8%; height:8%; background:#c98a2e; border-radius:50%; top:-10%; }
  .giraffe-hornball.l { left:37%; } .giraffe-hornball.r { left:55%; }
  .giraffe-ear { width:10%; height:8%; background:#e0a83c; border-radius:50%; top:6%; }
  .giraffe-ear.l { left:28%; } .giraffe-ear.r { left:62%; }
  .giraffe-spot { background:#b5731d; border-radius:40%; }
  .giraffe-swirl { left:48%; top:-22%; font-size: 0.9em; }
  .giraffe-eye-x { color:#5a3a10; font-weight:bold; position:absolute; top:8%; font-size:0.7em; }
  .giraffe-eye-x.l { left:34%; } .giraffe-eye-x.r { left:52%; }

  /* ---- BABY BULL (decoy) ---- */
  .bull-body { left:16%; top:42%; width:68%; height:42%; background:#8d7a6b; border-radius:44%; }
  .bull-head { left:56%; top:14%; width:38%; height:36%; background:#8d7a6b; border-radius:50%; }
  .bull-snout { left:76%; top:34%; width:20%; height:16%; background:#c9a789; border-radius:40%; }
  .bull-nostril { width:3%; height:3%; background:#3a2a20; border-radius:50%; top:40%; }
  .bull-nostril.n1 { left:80%; } .bull-nostril.n2 { left:88%; }
  .bull-horn { width:12%; height:6%; background:#efe6d8; border-radius:6px; top:12%; }
  .bull-horn.h1 { left:54%; transform:rotate(-20deg); } .bull-horn.h2 { left:70%; transform:rotate(20deg); }
  .bull-eye { width:5%; height:6%; background:#241a12; border-radius:50%; top:26%; left:66%; }
  .bull-ear { width:9%; height:8%; background:#7a6350; border-radius:50%; top:20%; }
  .bull-ear.e1 { left:58%; } .bull-ear.e2 { left:80%; }
  .bull-diaper { left:12%; top:60%; width:60%; height:32%; background:#ffffff; border-radius:30px; box-shadow: inset 0 -6px 0 #e6e6e6; }
  .bull-diaper-tab { width:8%; height:12%; background:#7fd0e8; border-radius:4px; top:66%; }
  .bull-diaper-tab.t1 { left:6%; } .bull-diaper-tab.t2 { left:70%; }
  .bull-tail { left:4%; top:46%; width:14%; height:8%; background:#6e5340; border-radius:6px; }

  /* ---- LOSE OVERLAY ---- */
  #loseOverlay {
    position: absolute; inset: 0; z-index: 80; pointer-events: none;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #flash {
    position:absolute; inset:0; background:#fff; opacity:0; z-index:90; pointer-events:none;
  }
  .flash-hit { animation: flashHit 0.25s ease-out; }
  @keyframes flashHit { 0% { opacity:0; } 30% { opacity:0.9; } 100% { opacity:0; } }

  .shake-screen { animation: screenShake 0.5s ease-in-out; }
  @keyframes screenShake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-8px,4px); }
    40% { transform: translate(8px,-4px); }
    60% { transform: translate(-6px,-4px); }
    80% { transform: translate(6px,4px); }
  }

  .furious-bull {
    position:absolute; width:260px; height:220px;
    animation: furiousCharge 0.9s ease-in forwards;
  }
  @keyframes furiousCharge {
    0% { transform: scale(0.15) translateY(40px); opacity:0.4; }
    70% { transform: scale(1.5) translateY(0); opacity:1; }
    100% { transform: scale(2.6) translateY(-10px); opacity:1; }
  }
  .fb-body { position:absolute; left:20px; top:80px; width:210px; height:120px; background:#5a1f1f; border-radius:50px; }
  .fb-head { position:absolute; left:150px; top:20px; width:110px; height:100px; background:#5a1f1f; border-radius:50%; }
  .fb-snout { position:absolute; left:210px; top:70px; width:60px; height:46px; background:#8a4a3a; border-radius:40%; }
  .fb-nostril { position:absolute; width:10px; height:14px; background:#1a0a08; border-radius:50%; top:82px; }
  .fb-nostril.n1 { left:222px; } .fb-nostril.n2 { left:248px; }
  .fb-horn { position:absolute; width:60px; height:18px; background:#f2e9da; border-radius:8px; }
  .fb-horn.h1 { left:130px; top:30px; transform:rotate(-35deg); }
  .fb-horn.h2 { left:190px; top:16px; transform:rotate(30deg); }
  .fb-eye { position:absolute; width:20px; height:20px; background:#ff2020; border-radius:50%; top:56px; box-shadow:0 0 10px #ff4040; }
  .fb-eye.e1 { left:172px; } .fb-eye.e2 { left:212px; }
  .fb-brow { position:absolute; width:26px; height:8px; background:#1a0a08; top:46px; border-radius:4px; }
  .fb-brow.b1 { left:168px; transform:rotate(20deg); } .fb-brow.b2 { left:206px; transform:rotate(-20deg); }
  .fb-steam { position:absolute; width:16px; height:16px; background:#ddd; border-radius:50%; opacity:0.8; animation: steamPuff 0.6s ease-out infinite; }
  @keyframes steamPuff { 0% { transform:translateY(0) scale(0.6); opacity:0.8; } 100% { transform:translateY(-30px) scale(1.4); opacity:0; } }

  .poopy {
    position:absolute; width:150px; height:170px;
    animation: poopIn 0.4s ease-out;
  }
  @keyframes poopIn { from { transform:scale(0) rotate(-20deg); } to { transform:scale(1) rotate(0deg); } }
  .poop-swirl { position:absolute; background:#6b4423; border-radius:50%; left:50%; transform:translateX(-50%); }
  .poop-face-eye { position:absolute; width:10px; height:10px; background:#2b1a0e; border-radius:50%; top:70px; }
  .poop-face-eye.pe1 { left:50px; } .poop-face-eye.pe2 { left:88px; }
  .poop-smile { position:absolute; left:56px; top:84px; width:34px; height:16px; border-bottom:5px solid #2b1a0e; border-radius:0 0 20px 20px; }
  .poop-stink { position:absolute; font-size:26px; opacity:0.8; animation: stinkRise 1.4s ease-in-out infinite; }
  .poop-fly { position:absolute; width:8px; height:6px; background:#1a1a1a; border-radius:50%; animation: flyBuzz 0.5s linear infinite; }

  @keyframes stinkRise {
    0% { transform: translateY(0) rotate(0deg); opacity:0.9; }
    100% { transform: translateY(-40px) rotate(10deg); opacity:0; }
  }
  @keyframes flyBuzz {
    0% { transform: translate(0,0); }
    25% { transform: translate(8px,-6px); }
    50% { transform: translate(0,-10px); }
    75% { transform: translate(-8px,-4px); }
    100% { transform: translate(0,0); }
  }

  #loseCaption {
    position:absolute;
    color:#fff;
    font-size:22px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    text-align:center;
    opacity:0;
  }
  .caption-show { animation: captionIn 0.4s ease-out forwards; }
  @keyframes captionIn { to { opacity:1; } }

  .confetti {
    position: absolute; width: 12px; height: 12px; border-radius: 3px;
    animation: confettiFall 0.9s ease-out forwards; pointer-events:none;
  }
  @keyframes confettiFall {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
</style>
</head>
<body>
  <div id="scoreBar">⭐ <span id="score">0</span></div>
  <div id="stage"></div>
  <div id="hint">Toca só no cavalo de óculos, na ovelha do chapéu e na girafa tonta! Cuidado com o tourinho de fralda 🙈</div>
  <div id="flash"></div>
  <div id="loseOverlay"></div>

<script>
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const loseOverlay = document.getElementById('loseOverlay');
  const flash = document.getElementById('flash');
  let score = 0;
  let gameActive = true;

  function el(tag, cls) {
    const e = document.createElement('div');
    if (cls) e.className = cls;
    return e;
  }

  function part(cls, styleObj) {
    const p = el('div', 'part ' + cls);
    if (styleObj) Object.assign(p.style, styleObj);
    return p;
  }

  /* ---- Audio ---- */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, start, dur, type='sine', vol=0.22) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(start); osc.stop(start + dur);
  }
  function playPop() {
    ensureAudio();
    const now = audioCtx.currentTime;
    const f = 320 + Math.random() * 200;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 3, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.2);
  }
  function playRumble() {
    ensureAudio();
    const now = audioCtx.currentTime;
    tone(90, now, 0.9, 'sawtooth', 0.2);
    tone(70, now + 0.1, 0.9, 'sawtooth', 0.18);
  }
  function playImpact() {
    ensureAudio();
    const now = audioCtx.currentTime;
    tone(140, now, 0.3, 'square', 0.28);
    tone(60, now, 0.4, 'sine', 0.3);
  }
  function playStink() {
    ensureAudio();
    const now = audioCtx.currentTime;
    [400, 320, 260, 200].forEach((f, i) => tone(f, now + i * 0.09, 0.18, 'triangle', 0.15));
  }
  function playSwarmCue() {
    ensureAudio();
    const now = audioCtx.currentTime;
    [392, 440, 494, 523].forEach((f, i) => tone(f, now + i * 0.07, 0.2, 'square', 0.12));
  }

  function randRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  /* ---- Confetti ---- */
  function spawnConfetti(x, y) {
    const colors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
    for (let i = 0; i < 14; i++) {
      const c = el('div', 'confetti');
      c.style.left = x + 'px'; c.style.top = y + 'px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 140;
      c.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      c.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      c.style.setProperty('--rot', Math.random() * 720 + 'deg');
      stage.appendChild(c);
      setTimeout(() => c.remove(), 950);
    }
  }

  /* ---- Critter builders ---- */
  function buildHorse(container) {
    container.appendChild(part('horse-tail'));
    container.appendChild(part('horse-body'));
    container.appendChild(part('horse-ear l'));
    container.appendChild(part('horse-ear r'));
    container.appendChild(part('horse-mane'));
    container.appendChild(part('horse-head'));
    container.appendChild(part('horse-snout'));
    container.appendChild(part('horse-glasses-bridge'));
    container.appendChild(part('horse-glass l'));
    container.appendChild(part('horse-glass r'));
  }

  function buildSheep(container) {
    const puffs = [
      {l:10,t:30,w:26,h:26},{l:30,t:14,w:30,h:30},{l:56,t:14,w:30,h:30},
      {l:78,t:30,w:26,h:26},{l:20,t:44,w:30,h:30},{l:50,t:44,w:32,h:32}
    ];
    puffs.forEach(p => {
      container.appendChild(part('sheep-fluff', { left:p.l+'%', top:p.t+'%', width:p.w+'%', height:p.h+'%' }));
    });
    container.appendChild(part('sheep-face'));
    container.appendChild(part('sheep-ear l'));
    container.appendChild(part('sheep-ear r'));
    container.appendChild(part('sheep-eye l'));
    container.appendChild(part('sheep-eye r'));
    const hatColors = ['#e05263', '#3d84a8', '#f2a541', '#7a4ca0'];
    const hatColor = hatColors[Math.floor(Math.random() * hatColors.length)];
    container.appendChild(part('sheep-hat', { background: hatColor }));
    container.appendChild(part('sheep-hat-brim', { background: hatColor }));
    for (let i = 0; i < 4; i++) {
      container.appendChild(part('leg', { left: (26 + i * 16) + '%', background:'#3a3632' }));
    }
  }

  function buildGiraffe(container) {
    for (let i = 0; i < 4; i++) {
      container.appendChild(part('leg', { left: (28 + i * 12) + '%', height:'26%', background:'#f0c14c' }));
    }
    container.appendChild(part('giraffe-body'));
    const spots = [
      {l:30,t:60,s:8},{l:44,t:66,s:7},{l:58,t:58,s:8},{l:36,t:20,s:6},{l:48,t:34,s:6}
    ];
    spots.forEach(s => container.appendChild(part('giraffe-spot', { left:s.l+'%', top:s.t+'%', width:s.s+'%', height:s.s+'%' })));
    container.appendChild(part('giraffe-neck'));
    container.appendChild(part('giraffe-ear l'));
    container.appendChild(part('giraffe-ear r'));
    container.appendChild(part('giraffe-hornball l'));
    container.appendChild(part('giraffe-hornball r'));
    container.appendChild(part('giraffe-horn l'));
    container.appendChild(part('giraffe-horn r'));
    container.appendChild(part('giraffe-head'));
    const xL = part('giraffe-eye-x l'); xL.textContent = '@';
    const xR = part('giraffe-eye-x r'); xR.textContent = '@';
    container.appendChild(xL);
    container.appendChild(xR);
    const swirl = part('giraffe-swirl');
    swirl.textContent = '💫';
    container.appendChild(swirl);
  }

  function buildBabyBull(container) {
    container.appendChild(part('bull-tail'));
    container.appendChild(part('bull-body'));
    container.appendChild(part('bull-diaper'));
    container.appendChild(part('bull-diaper-tab t1'));
    container.appendChild(part('bull-diaper-tab t2'));
    container.appendChild(part('bull-ear e1'));
    container.appendChild(part('bull-ear e2'));
    container.appendChild(part('bull-horn h1'));
    container.appendChild(part('bull-horn h2'));
    container.appendChild(part('bull-head'));
    container.appendChild(part('bull-eye'));
    container.appendChild(part('bull-snout'));
    container.appendChild(part('bull-nostril n1'));
    container.appendChild(part('bull-nostril n2'));
  }

  const TYPES = {
    horse: { build: buildHorse, wobble: false },
    sheep: { build: buildSheep, wobble: false },
    giraffe: { build: buildGiraffe, wobble: true },
    bull: { build: buildBabyBull, wobble: false }
  };

  function pickType() {
    const r = Math.random();
    if (r < 0.34) return 'horse';
    if (r < 0.68) return 'sheep';
    return 'giraffe';
  }

  function spawnCritter() {
    if (!gameActive) return;
    const type = pickType();
    const def = TYPES[type];
    const container = el('div', 'critter' + (def.wobble ? ' wobble' : ''));
    container.dataset.type = type;

    const size = type === 'giraffe' ? (140 + Math.random() * 50) : (110 + Math.random() * 60);
    container.style.width = size + 'px';
    container.style.height = (size * (type === 'giraffe' ? 1.3 : 0.9)) + 'px';

    const margin = size;
    const x = Math.random() * (window.innerWidth - margin * 1.1) + margin * 0.05;
    const y = Math.random() * (window.innerHeight - margin * 1.3) + margin * 0.1;
    container.style.left = x + 'px';
    container.style.top = y + 'px';
    container.style.animationDuration = (2 + Math.random() * 1.5) + 's, ' + (1.6 + Math.random() * 1.2) + 's';

    def.build(container);

    container.addEventListener('pointerdown', () => handleTap(container, type), { once: true });
    stage.appendChild(container);
  }

  function handleTap(container, type) {
    if (!gameActive) return;
    ensureAudio();
    if (type === 'bull') {
      triggerLose();
      return;
    }
    const rect = container.getBoundingClientRect();
    spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
    playPop();
    container.classList.add('pop');
    setTimeout(() => container.remove(), 350);
    score++;
    scoreEl.textContent = score;
    spawnCritter();
  }

  function clearStage() {
    stage.querySelectorAll('.critter').forEach(c => c.remove());
  }

  /* ---- Baby bull: peeks in and out on its own, sometimes in a big group ---- */
  function spawnBull(visibleMs) {
    if (!gameActive) return;
    const def = TYPES.bull;
    const container = el('div', 'critter');
    container.dataset.type = 'bull';

    const size = 100 + Math.random() * 50;
    container.style.width = size + 'px';
    container.style.height = (size * 0.9) + 'px';

    const margin = size;
    const x = randRange(margin * 0.05, window.innerWidth - margin * 1.15);
    const y = randRange(margin * 0.1, window.innerHeight - margin * 1.3);
    container.style.left = x + 'px';
    container.style.top = y + 'px';
    container.style.animationDuration = (2 + Math.random() * 1.5) + 's, ' + (1.6 + Math.random() * 1.2) + 's';

    def.build(container);
    container.addEventListener('pointerdown', () => handleTap(container, 'bull'), { once: true });
    stage.appendChild(container);

    setTimeout(() => {
      if (!container.isConnected) return;
      container.classList.add('vanish');
      setTimeout(() => container.remove(), 300);
    }, visibleMs);
  }

  function spawnBullSwarm() {
    if (!gameActive) return;
    playSwarmCue();
    const count = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      setTimeout(() => spawnBull(randRange(2000, 2500)), i * 110);
    }
  }

  function scheduleSingleBull() {
    setTimeout(() => {
      if (gameActive && !document.querySelector('.critter[data-type="bull"]')) {
        spawnBull(randRange(1400, 2200));
      }
      scheduleSingleBull();
    }, randRange(4000, 7000));
  }

  function scheduleBullSwarm() {
    setTimeout(() => {
      spawnBullSwarm();
      scheduleBullSwarm();
    }, randRange(16000, 26000));
  }

  function triggerLose() {
    gameActive = false;
    clearStage();
    document.body.classList.add('shake-screen');
    playRumble();

    const bull = el('div', 'furious-bull');
    bull.style.left = (window.innerWidth / 2 - 130) + 'px';
    bull.style.top = (window.innerHeight / 2 - 110) + 'px';
    bull.innerHTML = `
      <div class="fb-body"></div>
      <div class="fb-horn h1"></div><div class="fb-horn h2"></div>
      <div class="fb-head"></div>
      <div class="fb-brow b1"></div><div class="fb-brow b2"></div>
      <div class="fb-eye e1"></div><div class="fb-eye e2"></div>
      <div class="fb-snout"></div>
      <div class="fb-nostril n1"></div><div class="fb-nostril n2"></div>
      <div class="fb-steam" style="left:210px; top:65px; animation-delay:0s;"></div>
      <div class="fb-steam" style="left:238px; top:70px; animation-delay:0.2s;"></div>
    `;
    loseOverlay.appendChild(bull);

    setTimeout(() => {
      flash.classList.add('flash-hit');
      playImpact();
    }, 850);

    setTimeout(() => {
      document.body.classList.remove('shake-screen');
      bull.remove();
      flash.classList.remove('flash-hit');
      showPoop();
    }, 1050);
  }

  function showPoop() {
    playStink();
    const poop = el('div', 'poopy');
    poop.style.left = (window.innerWidth / 2 - 75) + 'px';
    poop.style.top = (window.innerHeight / 2 - 100) + 'px';
    poop.innerHTML = `
      <div class="poop-swirl" style="width:130px; height:60px; top:100px;"></div>
      <div class="poop-swirl" style="width:100px; height:60px; top:60px;"></div>
      <div class="poop-swirl" style="width:70px; height:55px; top:26px;"></div>
      <div class="poop-face-eye pe1"></div><div class="poop-face-eye pe2"></div>
      <div class="poop-smile"></div>
      <div class="poop-stink" style="left:20px; top:-10px; animation-delay:0s;">💨</div>
      <div class="poop-stink" style="left:70px; top:-20px; animation-delay:0.4s;">💨</div>
      <div class="poop-stink" style="left:110px; top:-8px; animation-delay:0.8s;">💨</div>
      <div class="poop-fly" style="left:10px; top:20px;"></div>
      <div class="poop-fly" style="left:130px; top:30px; animation-delay:0.2s;"></div>
    `;
    loseOverlay.appendChild(poop);

    const caption = el('div', 'caption-show');
    caption.id = 'loseCaption';
    caption.textContent = 'Xi, era uma armadilha! 💩';
    caption.style.left = '50%';
    caption.style.top = '68%';
    caption.style.transform = 'translateX(-50%)';
    loseOverlay.appendChild(caption);

    setTimeout(() => {
      poop.remove();
      caption.remove();
      score = 0;
      scoreEl.textContent = score;
      gameActive = true;
      init();
    }, 2400);
  }

  const INITIAL_ITEMS = 6;
  function init() {
    for (let i = 0; i < INITIAL_ITEMS; i++) {
      setTimeout(spawnCritter, i * 160);
    }
  }

  document.body.addEventListener('pointerdown', ensureAudio, { once: true });
  init();
  scheduleSingleBull();
  scheduleBullSwarm();
</script>
</body>
</html>
