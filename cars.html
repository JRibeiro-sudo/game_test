<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Car Badge Match</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Comic Sans MS', 'Trebuchet MS', Verdana, sans-serif;
    background: linear-gradient(180deg, #8fd3ff 0%, #b9f3d6 70%, #d9f7c4 100%);
  }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }

  #scoreBar {
    margin-top: 12px;
    display: flex;
    gap: 6px;
    font-size: 30px;
    z-index: 10;
    text-shadow: 0 2px 3px rgba(0,0,0,0.2);
  }
  .star-slot { opacity: 0.3; }
  .star-slot.filled { opacity: 1; animation: starPop 0.4s ease-out; }
  @keyframes starPop { from { transform: scale(0.3); } to { transform: scale(1); } }

  #hint {
    margin-top: 4px;
    color: #ffffffcc;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    font-size: 18px;
    z-index: 10;
  }

  /* ---- Car ---- */
  #carArea {
    margin-top: 22px;
    width: 300px;
    height: 150px;
    position: relative;
  }
  .car-shadow {
    position: absolute;
    bottom: 6px;
    left: 10%;
    width: 80%;
    height: 16px;
    background: rgba(0,0,0,0.2);
    border-radius: 50%;
    filter: blur(3px);
  }
  .car-body {
    position: absolute;
    left: 4%;
    top: 42%;
    width: 92%;
    height: 46%;
    border-radius: 32px 32px 12px 12px;
    box-shadow: 0 6px 8px rgba(0,0,0,0.25) inset, 0 4px 6px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  .car-roof {
    position: absolute;
    left: 24%;
    top: 12%;
    width: 46%;
    height: 40%;
    background: linear-gradient(180deg, #cfeaff, #9fd3f5);
    clip-path: polygon(12% 100%, 22% 0%, 78% 0%, 90% 100%);
    border-radius: 10px 10px 0 0;
  }
  .car-wheel {
    position: absolute;
    bottom: 4%;
    width: 15%;
    aspect-ratio: 1;
    background: #222;
    border-radius: 50%;
    box-shadow: inset 0 0 0 6px #666;
  }
  .car-wheel.left { left: 14%; }
  .car-wheel.right { right: 14%; }
  .headlight {
    position: absolute;
    top: 55%;
    width: 8%;
    height: 20%;
    background: #fff6b0;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff6b0aa;
  }
  .headlight.hl-left { left: 2%; }
  .headlight.hl-right { right: 2%; }
  .car-badge-slot {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: 30%;
    aspect-ratio: 1;
  }
  .bounce-happy { animation: bounceHappy 0.6s ease-in-out; }
  @keyframes bounceHappy {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-14px) rotate(-2deg); }
    60% { transform: translateY(0) rotate(2deg); }
  }
  .shake-oops { animation: shakeOops 0.5s ease-in-out; }
  @keyframes shakeOops {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  /* ---- Badge (shared design used for car emblem + answer choices) ---- */
  .badge-box {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .badge-box.shape-circle { border-radius: 50%; }
  .badge-box.shape-rect { border-radius: 18%; }
  .badge-box.shape-diamond { border-radius: 14%; transform: rotate(45deg); }
  .badge-box.shape-shield { clip-path: polygon(50% 0%, 100% 20%, 100% 65%, 50% 100%, 0% 65%, 0% 20%); }
  .badge-box { box-shadow: 0 3px 6px rgba(0,0,0,0.35); }
  .b-fill { position: absolute; inset: 0; }
  .b-abs { position: absolute; }

  /* ---- Choices ---- */
  #choices {
    margin-top: 26px;
    display: flex;
    gap: 28px;
    z-index: 10;
  }
  .choice-btn {
    width: 108px;
    height: 108px;
    border: 5px solid #ffffffcc;
    border-radius: 50%;
    padding: 0;
    background: transparent;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .choice-btn:active { transform: scale(0.92); }
  .choice-btn:disabled { cursor: default; }
  .choice-inner { width: 100%; height: 100%; }

  /* ---- Overlay characters ---- */
  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }

  .monkey {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    height: 200px;
    animation: monkeyBounce 0.5s ease-in-out infinite, monkeyIn 0.3s ease-out;
  }
  @keyframes monkeyIn { from { transform: translate(-50%,-50%) scale(0); } to { transform: translate(-50%,-50%) scale(1); } }
  @keyframes monkeyBounce {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -22px; }
  }
  .m-ear { position: absolute; width: 46px; height: 46px; background: #7a4a25; border-radius: 50%; top: 6px; }
  .m-ear.l { left: -6px; } .m-ear.r { right: -6px; }
  .m-head { position: absolute; left: 30px; top: 0; width: 120px; height: 110px; background: #8b5a2b; border-radius: 50%; }
  .m-face { position: absolute; left: 50px; top: 34px; width: 80px; height: 66px; background: #f0c896; border-radius: 50%; }
  .m-eye { position: absolute; width: 12px; height: 14px; background: #2b1a0e; border-radius: 50%; top: 20px; }
  .m-eye.l { left: 20px; } .m-eye.r { right: 20px; }
  .m-smile { position: absolute; left: 22px; top: 38px; width: 36px; height: 18px; border-bottom: 6px solid #2b1a0e; border-radius: 0 0 20px 20px; }
  .m-body { position: absolute; left: 45px; top: 96px; width: 90px; height: 84px; background: #8b5a2b; border-radius: 40px; }
  .m-belly { position: absolute; left: 62px; top: 108px; width: 56px; height: 60px; background: #f0c896; border-radius: 30px; }
  .m-arm { position: absolute; top: 100px; width: 20px; height: 64px; background: #7a4a25; border-radius: 12px; transform-origin: top center; animation: armWave 0.5s ease-in-out infinite; }
  .m-arm.l { left: 20px; animation-delay: 0.05s; }
  .m-arm.r { right: 20px; animation-name: armWaveR; }
  @keyframes armWave { 0%,100% { transform: rotate(-30deg); } 50% { transform: rotate(20deg); } }
  @keyframes armWaveR { 0%,100% { transform: rotate(30deg); } 50% { transform: rotate(-20deg); } }
  .m-leg { position: absolute; bottom: -6px; width: 24px; height: 40px; background: #7a4a25; border-radius: 10px; transform-origin: top center; animation: legSway 0.5s ease-in-out infinite; }
  .m-leg.l { left: 52px; } .m-leg.r { right: 52px; animation-delay: 0.25s; }
  @keyframes legSway { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }

  .bull {
    position: absolute;
    top: 46%;
    left: -220px;
    width: 220px;
    height: 170px;
    animation: bullRun 1.5s linear forwards;
  }
  @keyframes bullRun {
    0% { left: -220px; }
    100% { left: 110%; }
  }
  .bu-body { position: absolute; left: 30px; top: 40px; width: 150px; height: 90px; background: #8d6e56; border-radius: 46px; }
  .bu-head { position: absolute; left: 130px; top: 14px; width: 78px; height: 68px; background: #8d6e56; border-radius: 50%; }
  .bu-snout { position: absolute; left: 168px; top: 44px; width: 42px; height: 32px; background: #c9a789; border-radius: 40%; }
  .bu-nostril { position: absolute; width: 6px; height: 6px; background: #3a2a20; border-radius: 50%; top: 56px; }
  .bu-nostril.n1 { left: 178px; } .bu-nostril.n2 { left: 194px; }
  .bu-ring { position: absolute; left: 182px; top: 62px; width: 18px; height: 12px; border: 3px solid #d8d0c0; border-radius: 50%; background: transparent; }
  .bu-horn { position: absolute; width: 34px; height: 12px; background: #efe6d8; border-radius: 8px; }
  .bu-horn.h1 { left: 118px; top: 8px; transform: rotate(-25deg); }
  .bu-horn.h2 { left: 150px; top: 2px; transform: rotate(20deg); }
  .bu-eye { position: absolute; width: 8px; height: 8px; background: #201510; border-radius: 50%; top: 32px; left: 168px; }
  .bu-ear { position: absolute; width: 22px; height: 16px; background: #7a5c46; border-radius: 50%; top: 22px; }
  .bu-ear.e1 { left: 132px; } .bu-ear.e2 { left: 172px; }
  .bu-pants { position: absolute; left: 46px; top: 96px; width: 118px; height: 50px; background: #ff7dc0; border-radius: 20px; box-shadow: inset 0 -6px 0 #ff5cae; }
  .bu-leg { position: absolute; bottom: 4px; width: 22px; height: 34px; background: #ff9ecf; border-radius: 8px; transform-origin: top center; animation: bullLeg 0.22s linear infinite; }
  .bu-leg.bl1 { left: 56px; } .bu-leg.bl2 { left: 92px; animation-delay: 0.11s; }
  .bu-hoof { position: absolute; bottom: -2px; width: 22px; height: 10px; background: #3a2a20; border-radius: 6px; }
  @keyframes bullLeg { 0%,100% { transform: rotate(-25deg); } 50% { transform: rotate(25deg); } }
  .bu-tail { position: absolute; left: 18px; top: 60px; width: 30px; height: 8px; background: #6e5340; border-radius: 6px; transform-origin: right center; animation: tailWag 0.3s ease-in-out infinite; }
  @keyframes tailWag { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }

  .confetti {
    position: absolute; width: 12px; height: 12px; border-radius: 3px;
    animation: confettiFall 1s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  /* ---- Results ---- */
  #resultScreen {
    position: absolute;
    inset: 0;
    background: rgba(20, 30, 40, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
  }
  #resultCard {
    background: #fffdf6;
    border-radius: 28px;
    padding: 34px 40px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  }
  #resultScore { font-size: 40px; margin: 8px 0 18px; }
  #playAgain {
    font-size: 44px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: none;
    background: #ffca3a;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.25);
  }
  #playAgain:active { transform: scale(0.92); }
</style>
</head>
<body>
<div id="stage">
  <div id="scoreBar"></div>
  <div id="hint">Tap the badge that matches the car!</div>

  <div id="carArea">
    <div class="car-shadow"></div>
    <div class="car-roof"></div>
    <div class="car-body" id="carBody">
      <div class="headlight hl-left"></div>
      <div class="headlight hl-right"></div>
      <div class="car-badge-slot" id="carBadgeSlot"></div>
    </div>
    <div class="car-wheel left"></div>
    <div class="car-wheel right"></div>
  </div>

  <div id="choices"></div>
</div>

<div id="overlay"></div>

<div id="resultScreen">
  <div id="resultCard">
    <div id="resultScore"></div>
    <button id="playAgain">🔁</button>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const scoreBar = document.getElementById('scoreBar');
const choicesEl = document.getElementById('choices');
const carBody = document.getElementById('carBody');
const carBadgeSlot = document.getElementById('carBadgeSlot');
const resultScreen = document.getElementById('resultScreen');
const resultScore = document.getElementById('resultScore');
const playAgainBtn = document.getElementById('playAgain');

const TOTAL_ROUNDS = 8;

const BRANDS = [
  { id: 'ferrari',     carColor: '#c62828', badge: { kind: 'leap',        bg: '#c62828', fg: '#161616' } },
  { id: 'lamborghini', carColor: '#f2c200', badge: { kind: 'splitDiamond',bg: '#f2c200', fg: '#141414' } },
  { id: 'bmw',         carColor: '#1c69d4', badge: { kind: 'quarters',    bg: '#1c69d4', fg: '#ffffff' } },
  { id: 'mercedes',    carColor: '#9aa0a6', badge: { kind: 'triStar',     bg: '#9aa0a6', fg: '#ffffff' } },
  { id: 'audi',        carColor: '#b0b7bd', badge: { kind: 'rings4',      bg: '#e9edf0', fg: '#3a3f44' } },
  { id: 'vw',          carColor: '#1c3faa', badge: { kind: 'chevronRing', bg: '#1c3faa', fg: '#ffffff' } },
  { id: 'toyota',      carColor: '#e0e0e0', badge: { kind: 'ovals2',      bg: '#ffffff', fg: '#d32f2f' } },
  { id: 'porsche',     carColor: '#151515', badge: { kind: 'stripesShield', bg: '#151515', fg: '#f2c200', fg2: '#c62828' } },
  { id: 'jeep',        carColor: '#2e7d32', badge: { kind: 'grille',      bg: '#2e7d32', fg: '#ffffff' } },
  { id: 'mini',        carColor: '#f5f5f5', badge: { kind: 'checker',     bg: '#111111', fg: '#ffffff' } },
  { id: 'renault',     carColor: '#ffd400', badge: { kind: 'diamond',     bg: '#ffd400', fg: '#c9a600' } },
  { id: 'fiat',        carColor: '#d32f2f', badge: { kind: 'rectDot',     bg: '#d32f2f', fg: '#ffffff' } },
];

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function el(tag, cls, style) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (style) Object.assign(e.style, style);
  return e;
}

function buildBadge(brand, shapeOverride) {
  const b = brand.badge;
  const box = el('div', 'badge-box');
  const shapeMap = {
    leap: 'circle', splitDiamond: 'circle', quarters: 'circle', triStar: 'circle',
    rings4: 'circle', chevronRing: 'circle', ovals2: 'circle', stripesShield: 'shield',
    grille: 'circle', checker: 'circle', diamond: 'circle', rectDot: 'rect'
  };
  box.classList.add('shape-' + (shapeOverride || shapeMap[b.kind] || 'circle'));
  box.style.background = b.bg;

  switch (b.kind) {
    case 'leap': {
      const shape = el('div', '', {
        position: 'absolute', left: '20%', top: '22%', width: '60%', height: '56%',
        background: b.fg, borderRadius: '50% 50% 50% 10%', transform: 'rotate(-18deg)'
      });
      box.appendChild(shape);
      const head = el('div', '', { position:'absolute', left:'56%', top:'14%', width:'26%', height:'26%', background:b.fg, borderRadius:'50%' });
      box.appendChild(head);
      break;
    }
    case 'splitDiamond': {
      const half = el('div', '', { position:'absolute', inset:'0', background: `linear-gradient(135deg, ${b.bg} 50%, ${b.fg} 50%)` });
      box.appendChild(half);
      const dia = el('div', '', { position:'absolute', left:'30%', top:'30%', width:'40%', height:'40%', border:`4px solid #fff`, transform:'rotate(45deg)' });
      box.appendChild(dia);
      break;
    }
    case 'quarters': {
      box.style.background = `conic-gradient(${b.bg} 0deg 90deg, ${b.fg} 90deg 180deg, ${b.bg} 180deg 270deg, ${b.fg} 270deg 360deg)`;
      const ring = el('div', '', { position:'absolute', inset:'6%', borderRadius:'50%', border:'4px solid #222' });
      box.appendChild(ring);
      break;
    }
    case 'triStar': {
      for (let i = 0; i < 3; i++) {
        const bar = el('div', '', {
          position:'absolute', left:'48%', top:'8%', width:'4%', height:'42%',
          background: b.fg, transformOrigin:'bottom center',
          transform: `rotate(${i * 120}deg)`
        });
        box.appendChild(bar);
      }
      const hub = el('div', '', { position:'absolute', left:'44%', top:'44%', width:'12%', height:'12%', background:b.fg, borderRadius:'50%' });
      box.appendChild(hub);
      break;
    }
    case 'rings4': {
      const positions = [18, 34, 50, 66];
      positions.forEach(p => {
        const ring = el('div', '', {
          position:'absolute', left:`${p - 16}%`, top:'28%', width:'32%', height:'44%',
          border:`5px solid ${b.fg}`, borderRadius:'50%', background:'transparent'
        });
        box.appendChild(ring);
      });
      break;
    }
    case 'chevronRing': {
      const ring = el('div', '', { position:'absolute', inset:'8%', borderRadius:'50%', border:`6px solid ${b.fg}` });
      box.appendChild(ring);
      const chevron = el('div', '', {
        position:'absolute', left:'32%', top:'30%', width:'36%', height:'36%',
        borderBottom:`8px solid ${b.fg}`, borderRight:`8px solid ${b.fg}`, transform:'rotate(45deg)'
      });
      box.appendChild(chevron);
      break;
    }
    case 'ovals2': {
      const o1 = el('div', '', { position:'absolute', left:'12%', top:'32%', width:'50%', height:'34%', border:`5px solid ${b.fg}`, borderRadius:'50%' });
      const o2 = el('div', '', { position:'absolute', left:'38%', top:'32%', width:'50%', height:'34%', border:`5px solid ${b.fg}`, borderRadius:'50%' });
      box.appendChild(o1); box.appendChild(o2);
      break;
    }
    case 'stripesShield': {
      const colors = [b.fg, '#fff', b.fg2, '#fff', b.bg];
      colors.forEach((c, i) => {
        const stripe = el('div', '', { position:'absolute', left:'0', top:`${i * 20}%`, width:'100%', height:'20%', background:c });
        box.appendChild(stripe);
      });
      break;
    }
    case 'grille': {
      for (let i = 0; i < 6; i++) {
        const bar = el('div', '', { position:'absolute', left:`${10 + i * 14}%`, top:'20%', width:'6%', height:'40%', background:b.fg, borderRadius:'3px' });
        box.appendChild(bar);
      }
      const l1 = el('div', '', { position:'absolute', left:'20%', top:'68%', width:'18%', height:'18%', background:b.fg, borderRadius:'50%' });
      const l2 = el('div', '', { position:'absolute', right:'20%', top:'68%', width:'18%', height:'18%', background:b.fg, borderRadius:'50%' });
      box.appendChild(l1); box.appendChild(l2);
      break;
    }
    case 'checker': {
      box.style.background = `repeating-conic-gradient(${b.bg} 0% 25%, ${b.fg} 0% 50%)`;
      box.style.backgroundSize = '50% 50%';
      break;
    }
    case 'diamond': {
      box.classList.remove('shape-circle');
      box.classList.add('shape-diamond');
      const inner = el('div', '', { position:'absolute', inset:'14%', border:`4px solid ${b.fg}` });
      box.appendChild(inner);
      break;
    }
    case 'rectDot': {
      const dot = el('div', '', { position:'absolute', left:'30%', top:'30%', width:'40%', height:'40%', background:b.fg, borderRadius:'50%' });
      box.appendChild(dot);
      break;
    }
  }
  return box;
}

/* ---- Score ---- */
let score = 0;
let round = 0;
let sequence = [];
let locked = false;

function initScoreBar() {
  scoreBar.innerHTML = '';
  for (let i = 0; i < TOTAL_ROUNDS; i++) {
    const s = el('span', 'star-slot');
    s.textContent = '⭐';
    s.id = 'star-' + i;
    scoreBar.appendChild(s);
  }
}

/* ---- Audio ---- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, start, dur, type = 'sine', vol = 0.22) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(start); osc.stop(start + dur);
}
function playWin() {
  ensureAudio();
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, now + i * 0.09, 0.25, 'triangle'));
}
function playLose() {
  ensureAudio();
  const now = audioCtx.currentTime;
  tone(220, now, 0.3, 'sawtooth', 0.18);
  tone(180, now + 0.28, 0.4, 'sawtooth', 0.18);
}

/* ---- Confetti ---- */
function spawnConfetti(x, y) {
  const colors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
  for (let i = 0; i < 20; i++) {
    const c = el('div', 'confetti');
    c.style.left = x + 'px'; c.style.top = y + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 160;
    c.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    c.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    c.style.setProperty('--rot', Math.random() * 720 + 'deg');
    overlay.appendChild(c);
    setTimeout(() => c.remove(), 1050);
  }
}

/* ---- Characters ---- */
function showMonkey() {
  const m = el('div', 'monkey');
  m.innerHTML = `
    <div class="m-ear l"></div><div class="m-ear r"></div>
    <div class="m-head"></div>
    <div class="m-face">
      <div class="m-eye l"></div><div class="m-eye r"></div>
      <div class="m-smile"></div>
    </div>
    <div class="m-arm l"></div><div class="m-arm r"></div>
    <div class="m-body"></div>
    <div class="m-belly"></div>
    <div class="m-leg l"></div><div class="m-leg r"></div>
  `;
  overlay.appendChild(m);
  const rect = m.getBoundingClientRect();
  spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
  setTimeout(() => m.remove(), 1400);
}

function showBull() {
  const b = el('div', 'bull');
  b.innerHTML = `
    <div class="bu-tail"></div>
    <div class="bu-body"></div>
    <div class="bu-ear e1"></div><div class="bu-ear e2"></div>
    <div class="bu-horn h1"></div><div class="bu-horn h2"></div>
    <div class="bu-head"></div>
    <div class="bu-eye"></div>
    <div class="bu-snout"></div>
    <div class="bu-nostril n1"></div><div class="bu-nostril n2"></div>
    <div class="bu-ring"></div>
    <div class="bu-pants"></div>
    <div class="bu-leg bl1"><div class="bu-hoof"></div></div>
    <div class="bu-leg bl2"><div class="bu-hoof"></div></div>
  `;
  overlay.appendChild(b);
  setTimeout(() => b.remove(), 1550);
}

/* ---- Round flow ---- */
function newSequence() {
  sequence = shuffled(BRANDS).slice(0, TOTAL_ROUNDS);
}

function loadRound() {
  if (round >= TOTAL_ROUNDS) {
    endGame();
    return;
  }
  locked = false;
  const target = sequence[round];
  const distractors = shuffled(BRANDS.filter(b => b.id !== target.id)).slice(0, 2);
  const options = shuffled([target, ...distractors]);

  carBody.style.background = target.carColor;
  carBadgeSlot.innerHTML = '';
  carBadgeSlot.appendChild(buildBadge(target));

  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const inner = document.createElement('div');
    inner.className = 'choice-inner';
    inner.appendChild(buildBadge(opt));
    btn.appendChild(inner);
    btn.addEventListener('pointerdown', () => handleChoice(opt.id === target.id, btn));
    choicesEl.appendChild(btn);
  });
}

function handleChoice(correct, btn) {
  if (locked) return;
  locked = true;
  ensureAudio();
  choicesEl.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  if (correct) {
    score++;
    document.getElementById('star-' + round).classList.add('filled');
    carBody.classList.add('bounce-happy');
    playWin();
    showMonkey();
  } else {
    carBody.classList.add('shake-oops');
    playLose();
    showBull();
  }

  setTimeout(() => {
    carBody.classList.remove('bounce-happy', 'shake-oops');
    round++;
    loadRound();
  }, 1600);
}

function endGame() {
  resultScore.textContent = `${score} / ${TOTAL_ROUNDS} ⭐`;
  resultScreen.style.display = 'flex';
  if (score >= TOTAL_ROUNDS / 2) {
    showMonkey();
  } else {
    showBull();
  }
}

function startGame() {
  score = 0;
  round = 0;
  resultScreen.style.display = 'none';
  initScoreBar();
  newSequence();
  loadRound();
}

playAgainBtn.addEventListener('pointerdown', startGame);
document.body.addEventListener('pointerdown', ensureAudio, { once: true });

startGame();
</script>
